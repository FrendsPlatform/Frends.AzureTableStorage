name: QueryEntities main release
permissions:
  contents: write

on:
  push:
    branches:
      - main
    paths:
      - 'Frends.AzureTableStorage.QueryEntities/**'
      - '.github/workflows/QueryEntities*.yml'
  workflow_dispatch:

jobs:
  main_pipeline:
    uses: FrendsPlatform/FrendsTasks/.github/workflows/official_task_pipeline.yml@main
    with:
      workflow_mode: main
      os: all
      workdir: Frends.AzureTableStorage.QueryEntities
      env_var_name_1: FOO
      env_var_name_2: BAR
    secrets:
      badge_service_api_key: ${{ secrets.BADGE_SERVICE_API_KEY }}
      target_feed_api_key: ${{ secrets.TASKS_FEED_API_KEY }}
      env_var_value_1: ${{ secrets.FOO }}
      env_var_value_2: ${{ secrets.BAR }}
